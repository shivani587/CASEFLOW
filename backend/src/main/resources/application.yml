server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: caseflow-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:caseflow_db}
    username: ${POSTGRES_USER:caseflow_user}
    password: ${POSTGRES_PASSWORD:caseflow_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

caseflow:
  jwt:
    secret: ${JWT_SECRET:CaseFlowSuperSecretSigningKeyForJwtAuthentication2026StrengthenJusticeLegalTech}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:caseflow_minio}
    secret-key: ${MINIO_SECRET_KEY:caseflow_minio_secret}
    bucket: ${MINIO_BUCKET:caseflow-documents}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
